server:
  address: ":8080"

routes:
  - name: users
    methods: [GET, POST, PUT, DELETE]
    path_prefix: /users
    upstream_pool: users-service
  - name: orders
    methods: [GET, POST]
    path_prefix: /orders
    upstream_pool: orders-service

upstream_pools:
  - name: users-service
    targets:
      - http://127.0.0.1:8081
  - name: orders-service
    targets:
      - http://127.0.0.1:8082
