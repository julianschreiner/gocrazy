services:
  users:
    image: node:24-alpine
    command: ["node", "/app/backend.mjs"]
    environment:
      SERVICE_NAME: users
    volumes:
      - ./test/integration/backend.mjs:/app/backend.mjs:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20

  orders:
    image: node:24-alpine
    command: ["node", "/app/backend.mjs"]
    environment:
      SERVICE_NAME: orders
    volumes:
      - ./test/integration/backend.mjs:/app/backend.mjs:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
